name: ASERKAR Multi-Source Collector

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: 

jobs:
  run-scraper-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Extraction Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python collector.py

      - name: Commit Backup Data
        run: |
          git config --global user.name "ASERKAR Bot"
          git config --global user.email "bot@aserkar.com"
          git add data/intelligence.json
          git commit -m "Daily Intelligence Extraction Backup" || exit 0
          git push
